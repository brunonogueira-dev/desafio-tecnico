# OniBus Express — sobe banco + API + frontend com um único comando:
#   docker compose up --build
# Valores vêm de um .env na raiz (veja .env.example); há defaults de dev abaixo.

name: onibus-express

services:
  postgres:
    image: postgres:16-alpine
    container_name: onibus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onibus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onibus_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-onibus_express}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onibus} -d ${POSTGRES_DB:-onibus_express}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onibus-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-onibus_express};Username=${POSTGRES_USER:-onibus};Password=${POSTGRES_PASSWORD:-onibus_dev_pwd}"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onibus-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres-data:
    name: onibus-postgres-data
